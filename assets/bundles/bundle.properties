bar.wirelessbelt-heat = Heat
block.wirelessbelt-wb-sender.name = Wireless Belt (Sender)
block.wirelessbelt-wb-sender.description = Buffers up to 500 items and sends them wirelessly, in turn, to every linked target: receivers or any building that accepts the item (turrets, core, containers...). Tap the sender, then tap targets to link or unlink (no limit). Select an item to send only that item; other items pass through to conveyors on the other sides.
block.wirelessbelt-wb-receiver.name = Wireless Belt (Receiver)
block.wirelessbelt-wb-receiver.description = Receives items from any number of linked senders and outputs them from any side.
block.wirelessbelt-battery-x5.name = Battery x5
block.wirelessbelt-battery-x5.description = 5x the capacity of a battery. Does not overheat.
block.wirelessbelt-battery-x10.name = Battery x10
block.wirelessbelt-battery-x10.description = 10x capacity. Heats up while discharging; output drops when hot and stops at max heat. Supply water (1.5x cooling) or cryofluid (3x cooling) to cool it and prevent heating.
block.wirelessbelt-battery-x20.name = Battery x20
block.wirelessbelt-battery-x20.description = 20x capacity. Heats up while discharging; output drops when hot and stops at max heat. Supply water (1.5x cooling) or cryofluid (3x cooling) to cool it and prevent heating.
block.wirelessbelt-battery-x30.name = Battery x30
block.wirelessbelt-battery-x30.description = 30x capacity. Heats up while discharging; output drops when hot and stops at max heat. Supply water (1.5x cooling) or cryofluid (3x cooling) to cool it and prevent heating.
block.wirelessbelt-ultra-drill.name = Ultra Drill
block.wirelessbelt-ultra-drill.description = 5x the speed of a blast drill for 20x the power. With water: another 2x speed and 1.5x power.
