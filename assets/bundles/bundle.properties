block.wirelessbelt-wb-sender.name = Wireless Belt (Sender)
block.wirelessbelt-wb-sender.description = Buffers up to 500 items and sends them wirelessly to all linked receivers in turn. Tap the sender, then tap receivers to link or unlink (no limit). Select an item to send only that item; other items pass through to conveyors on the other sides.
block.wirelessbelt-wb-receiver.name = Wireless Belt (Receiver)
block.wirelessbelt-wb-receiver.description = Receives items from any number of linked senders and outputs them from any side.
