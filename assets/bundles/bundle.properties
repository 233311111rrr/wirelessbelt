block.wirelessbelt-wb-sender.name = Wireless Belt (Sender)
block.wirelessbelt-wb-sender.description = Buffers up to 500 items and sends them wirelessly to its paired receiver. Tap the sender, then tap a receiver to link. Select an item to send only that item; other items pass through to conveyors on the other sides.
block.wirelessbelt-wb-receiver.name = Wireless Belt (Receiver)
block.wirelessbelt-wb-receiver.description = Receives items from its paired sender and outputs them from any side. One receiver can only be linked to one sender.
