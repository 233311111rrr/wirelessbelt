name: Build Wireless Belt

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build mod
        run: ./gradlew clean jar --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: wirelessbelt
          path: build/libs/wirelessbelt-1.0.jar
