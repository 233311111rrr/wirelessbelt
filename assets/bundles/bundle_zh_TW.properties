bar.wirelessbelt-heat = 熱度
block.wirelessbelt-wb-sender.name = 無線傳送帶（發送端）
block.wirelessbelt-wb-sender.description = 可緩衝 500 個物品，並輪流無線傳送給所有已連結的目標：接收端，或任何能接收該物品的建築（砲塔、核心、容器…）。點選發送端後再點目標即可連結或解除（數量不限）。選擇物品後只傳送該物品，其餘物品會穿過並由其他方向的輸送帶輸出。
block.wirelessbelt-wb-receiver.name = 無線傳送帶（接收端）
block.wirelessbelt-wb-receiver.description = 接收任意數量已連結發送端的物品，並從任意一邊輸出。
block.wirelessbelt-battery-x5.name = 電池 x5
block.wirelessbelt-battery-x5.description = 容量為原版電池的 5 倍，不會發熱。
block.wirelessbelt-battery-x10.name = 電池 x10
block.wirelessbelt-battery-x10.description = 容量 10 倍。放電時會緩慢發熱，熱度高時輸出下降，到最高時停止輸出。輸入水（降溫 1.5 倍）或冷卻液（降溫 3 倍）可加速降溫，且有液體時不會發熱。
block.wirelessbelt-battery-x20.name = 電池 x20
block.wirelessbelt-battery-x20.description = 容量 20 倍。放電時會緩慢發熱，熱度高時輸出下降，到最高時停止輸出。輸入水（降溫 1.5 倍）或冷卻液（降溫 3 倍）可加速降溫，且有液體時不會發熱。
block.wirelessbelt-battery-x30.name = 電池 x30
block.wirelessbelt-battery-x30.description = 容量 30 倍。放電時會緩慢發熱，熱度高時輸出下降，到最高時停止輸出。輸入水（降溫 1.5 倍）或冷卻液（降溫 3 倍）可加速降溫，且有液體時不會發熱。
block.wirelessbelt-ultra-drill.name = 超高速鑽頭
block.wirelessbelt-ultra-drill.description = 速度為爆破鑽頭的 5 倍，耗電 20 倍。輸入水後速度再 2 倍，耗電再 1.5 倍。
